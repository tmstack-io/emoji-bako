name: EmojiBako
options:
  bundleIdPrefix: io.tmstack
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

targets:
  EmojiBako:
    type: application
    platform: macOS
    sources:
      - EmojiBako
    info:
      path: EmojiBako/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tmstack.EmojiBako
        DEVELOPMENT_TEAM: PCUA32D2L3
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.4"
    scheme:
      gatherCoverageData: false
      testTargets:
        - EmojiBakoTests
  EmojiBakoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - EmojiBakoTests
    dependencies:
      - target: EmojiBako
    settings:
      base:
        DEVELOPMENT_TEAM: PCUA32D2L3
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.4"
        GENERATE_INFOPLIST_FILE: YES
