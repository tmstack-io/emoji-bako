name: EmojiBako
options:
  bundleIdPrefix: io.tmstack
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  developmentLanguage: en

targets:
  EmojiBako:
    type: application
    platform: macOS
    sources:
      - EmojiBako
      # 許諾表示を配布物に含めるため、ライセンス本文をアプリに同梱する
      - path: LICENSE
        buildPhase: resources
      - path: LICENSE-UNICODE.txt
        buildPhase: resources
    info:
      path: EmojiBako/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tmstack.EmojiBako
        DEVELOPMENT_TEAM: PCUA32D2L3
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # iCloud KVS（使用回数の同期）。識別子は$(TeamIdentifierPrefix)$(CFBundleIdentifier)なので、DebugとReleaseで別の保存先になる
        CODE_SIGN_ENTITLEMENTS: EmojiBako/EmojiBako.entitlements
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.4"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        # 開発版は配布版と別のアプリとして扱う（使用回数・設定・iCloud KVS・メニューバーの表示設定を分ける）
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.tmstack.EmojiBako.debug
    scheme:
      gatherCoverageData: false
      testTargets:
        - EmojiBakoTests
  EmojiBakoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - EmojiBakoTests
    dependencies:
      - target: EmojiBako
    settings:
      base:
        DEVELOPMENT_TEAM: PCUA32D2L3
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.4"
        GENERATE_INFOPLIST_FILE: YES
